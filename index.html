<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luke Reading Plan</title>
  <link rel="stylesheet" href="https://use.typekit.net/nfr5jnl.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f1ed;
      font-family: 'proxima-nova', 'Proxima Nova', system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 3rem 2rem 4rem;
    }

    /* ── Header ── */
    header {
      margin-bottom: 2.5rem;
      position: relative;
    }

    h1 {
      font-family: 'proxima-nova-condensed', 'proxima-nova', system-ui, sans-serif;
      font-weight: 900;
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 0.35em;
      flex-wrap: wrap;
    }

    .bubble {
      background: #2d6db5;
      color: #fff;
      border-radius: 999px;
      padding: 0.05em 0.35em 0.1em;
      display: inline-block;
    }

    .header-meta {
      margin-top: 1rem;
    }

    #progress-summary {
      font-size: 1rem;
      color: #555;
      font-weight: 500;
    }

    /* ── Hamburger menu ── */
    #menu-wrap {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 100;
    }

    #hamburger {
      background: #ece8e4;
      border: none;
      border-radius: 0.75rem;
      width: 2.6rem;
      height: 2.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: -4px 7px 20px -4px #0000001a;
    }

    #hamburger span {
      display: block;
      width: 18px;
      height: 2px;
      background: #1a1a1a;
      border-radius: 2px;
      transition: opacity 0.15s;
    }

    #hamburger:hover span {
      opacity: 0.6;
    }

    #menu-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: #ece8e4;
      border-radius: 0.9rem;
      box-shadow: -4px 7px 20px -4px #0000001a;
      overflow: hidden;
      min-width: 160px;
    }

    #menu-dropdown.open {
      display: block;
    }

    #reset-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      padding: 0.85rem 1.1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #c0392b;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }

    #reset-btn:hover {
      background: #e0dbd5;
    }

    /* ── Grid ── */
    #plan {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 520px;
    }

    /* ── Week card ── */
    .week-card {
      background: #ece8e4;
      border-radius: 1.4rem;
      padding: 1.6rem 1.6rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: -4px 7px 20px -4px #0000001a;
    }

    .week-card[data-current="true"] {
      outline: 2.5px solid #2d6db5;
    }

    .week-header {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .week-label {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1a1a1a;
    }

    .week-date {
      font-size: 0.85rem;
      color: #777;
      font-weight: 500;
    }

    .current-badge {
      display: inline-block;
      margin-top: 0.35rem;
      background: #2d6db5;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 0.2em 0.65em;
      width: fit-content;
    }

    /* ── Reading row ── */
    .reading-row {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .reading-text {
      font-size: 0.95rem;
      color: #333;
      font-weight: 500;
      line-height: 1.4;
    }

    .complete-btn {
      align-self: flex-start;
      background: #2d6db5;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.45rem 1.2rem;
      font-family: 'proxima-nova-condensed', 'proxima-nova', system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .complete-btn:hover {
      background: #245d9e;
    }

    .complete-btn[data-done="true"] {
      background: #6b9e4e;
    }

    .complete-btn[data-done="true"]:hover {
      background: #5a8940;
    }

    /* ── Divider between the two readings ── */
    .reading-divider {
      height: 1px;
      background: #d5d0c9;
    }
  </style>
</head>
<body>

<div id="menu-wrap">
  <button id="hamburger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div id="menu-dropdown" role="menu">
    <button id="reset-btn" role="menuitem">Reset Progress</button>
  </div>
</div>

<header>
  <h1>Reading <span class="bubble">Plan.</span></h1>
  <div class="header-meta">
    <p id="progress-summary"></p>
  </div>
</header>

<div id="plan"></div>

<script>
  const START_DATE = new Date("2026-05-17");

  function weekStartDate(weekNumber) {
    const d = new Date(START_DATE);
    d.setDate(d.getDate() + (weekNumber - 1) * 7);
    return d;
  }

  function formatDate(d) {
    return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  }

  const READINGS = [
    { week: 1,  reading1: "Luke 1",  reading2: "Luke 2"  },
    { week: 2,  reading1: "Luke 3",  reading2: "Luke 4"  },
    { week: 3,  reading1: "Luke 5",  reading2: "Luke 6"  },
    { week: 4,  reading1: "Luke 7",  reading2: "Luke 8"  },
    { week: 5,  reading1: "Luke 9",  reading2: "Luke 10" },
    { week: 6,  reading1: "Luke 11", reading2: "Luke 12" },
    { week: 7,  reading1: "Luke 13", reading2: "Luke 14" },
    { week: 8,  reading1: "Luke 15", reading2: "Luke 16" },
    { week: 9,  reading1: "Luke 17", reading2: "Luke 18" },
    { week: 10, reading1: "Luke 19", reading2: "Luke 20" },
    { week: 11, reading1: "Luke 21", reading2: "Luke 22" },
    { week: 12, reading1: "Luke 23", reading2: "Luke 24" },
  ];

  function currentWeekNumber() {
    const now = new Date();
    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    const diff = now - START_DATE;
    if (diff < 0) return null;
    const week = Math.floor(diff / msPerWeek) + 1;
    return week > 12 ? null : week;
  }

  const COOKIE_KEY = "luke_reading_plan";
  const COOKIE_DAYS = 365;

  function setCookie(value) {
    const expires = new Date(Date.now() + COOKIE_DAYS * 864e5).toUTCString();
    document.cookie = `${COOKIE_KEY}=${encodeURIComponent(JSON.stringify(value))}; expires=${expires}; path=/; SameSite=Lax`;
  }

  function getCookie() {
    const match = document.cookie.split("; ").find(c => c.startsWith(COOKIE_KEY + "="));
    if (!match) return null;
    try {
      return JSON.parse(decodeURIComponent(match.split("=").slice(1).join("=")));
    } catch { return null; }
  }

  function saveToCache(value) {
    try { localStorage.setItem(COOKIE_KEY, JSON.stringify(value)); } catch {}
  }

  function loadFromCache() {
    try {
      const raw = localStorage.getItem(COOKIE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }

  function loadProgress() {
    return getCookie() || loadFromCache() || {};
  }

  function saveProgress(p) {
    setCookie(p);
    saveToCache(p);
  }

  let progress = loadProgress();

  function updateSummary() {
    const total = READINGS.length * 2;
    const done = Object.values(progress).filter(Boolean).length;
    document.getElementById("progress-summary").textContent =
      `${done} of ${total} readings completed`;
  }

  function toggleReading(key, btn) {
    progress[key] = !progress[key];
    saveProgress(progress);
    updateSummary();
    const done = !!progress[key];
    btn.dataset.done = done ? "true" : "false";
    btn.textContent = done ? "Completed ✓" : "Mark Complete";
  }

  function render() {
    const container = document.getElementById("plan");
    container.innerHTML = "";
    const activeWeek = currentWeekNumber();

    READINGS.forEach(({ week, reading1, reading2 }) => {
      const card = document.createElement("article");
      card.className = "week-card";
      card.dataset.week = week;
      if (week === activeWeek) card.dataset.current = "true";

      // Week header
      const hdr = document.createElement("div");
      hdr.className = "week-header";

      const lbl = document.createElement("div");
      lbl.className = "week-label";
      lbl.textContent = `Week ${week}`;

      const dateEl = document.createElement("div");
      dateEl.className = "week-date";
      dateEl.textContent = formatDate(weekStartDate(week));

      hdr.appendChild(lbl);
      hdr.appendChild(dateEl);

      if (week === activeWeek) {
        const badge = document.createElement("div");
        badge.className = "current-badge";
        badge.textContent = "Current Week";
        hdr.appendChild(badge);
      }

      card.appendChild(hdr);

      // Reading rows
      [
        { text: reading1, key: `w${week}_r1` },
        { text: reading2, key: `w${week}_r2` },
      ].forEach(({ text, key }, i) => {
        if (i === 1) {
          const div = document.createElement("div");
          div.className = "reading-divider";
          card.appendChild(div);
        }

        const row = document.createElement("div");
        row.className = "reading-row";

        const passage = document.createElement("div");
        passage.className = "reading-text";
        passage.textContent = text;

        const done = !!progress[key];
        const btn = document.createElement("button");
        btn.className = "complete-btn";
        btn.dataset.done = done ? "true" : "false";
        btn.textContent = done ? "Completed ✓" : "Mark Complete";
        btn.addEventListener("click", () => toggleReading(key, btn));

        row.appendChild(passage);
        row.appendChild(btn);
        card.appendChild(row);
      });

      container.appendChild(card);
    });

    updateSummary();
  }

  const hamburger = document.getElementById("hamburger");
  const menuDropdown = document.getElementById("menu-dropdown");

  hamburger.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menuDropdown.classList.toggle("open");
    hamburger.setAttribute("aria-expanded", open);
  });

  document.addEventListener("click", () => {
    menuDropdown.classList.remove("open");
    hamburger.setAttribute("aria-expanded", "false");
  });

  menuDropdown.addEventListener("click", (e) => e.stopPropagation());

  document.getElementById("reset-btn").addEventListener("click", () => {
    menuDropdown.classList.remove("open");
    hamburger.setAttribute("aria-expanded", "false");
    if (confirm("Reset all reading progress?")) {
      progress = {};
      saveProgress(progress);
      render();
    }
  });

  render();
</script>

</body>
</html>
